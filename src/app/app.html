<main class="container">
  <h1>Frontender.itacademy</h1>

  <!--Lista de servicios -->
  <app-service-list 
  [service]="filteredServices()" 
  [totalPrice]="totalPrice()" 
  (serviceSelect)="serviceSelect($event)">
  </app-service-list>

   <!--Formulario -->
  <app-form-new-user 
  (userRegister)="saveUserData($event)">
  </app-form-new-user>

  <section>
    <section>
      <!--Filtrado de presupuestos de usuarios -->
      <h3>Pressupost en curs</h3>
      <input type="text" (input)="badgetListFilter($event)" placeholder="Buscar...">
    </section>

 <!--Tarjetas usuarios -->
    @for (client of clientsData(); track client) {

    <div class="client-card">
      <div class="info-client">
        <h4>Joan Farres{{ client.text }}</h4>
        <p>joan.farre@gmail.com{{ client.email }}</p>
        <p>666 666 666 {{ client.tel }}</p>
      </div>

      <div class="service-contracted">
        <h5>Serveis contractats: </h5>
        <ul>
          <li>Ads</li>
          <li>SEO</li>
        </ul>
      </div>

      <div class="total-contracted">
      <h2>400$</h2>
      </div>

    </div>
    }
  </section>

</main>
