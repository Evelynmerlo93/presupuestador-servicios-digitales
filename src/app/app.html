<main class="container">
  <h1>Frontender.itacademy</h1>

  <!--llamamos al componente hijo y le pasamos los datos del padre -->
  <app-service-list 
  [service]="listService()" 
  [totalPrice]="totalPrice()" 
  (serviceSelect)="serviceSelect($event)">
  </app-service-list>

  <app-form-new-user 
  (userRegister)="saveUserData($event)">
  </app-form-new-user>

  <section>
    <h2>Pressupost en curs: </h2>

    @for (client of clientsData(); track client) {
    <div class="client-card">
      <p>Text: {{ client.text }}</p>
      <p>Email: {{ client.email }}</p>
      <p>Telephone: {{ client.tel }}</p>
    </div>
    }
  </section>

</main>
