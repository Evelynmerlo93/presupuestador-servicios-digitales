<main class="container">
  <h1>Calculadora de Presupuestos</h1>

  <!-- Aqui llamamos al componente hijo y le pasamos los datos del padre -->
  <app-service-list 
  [service]="listService()"
  [totalPrice]="totalPrice()"
  (serviceSelect)="serviceSelect($event)">
  </app-service-list>
  <app-form-new-user 
  (userRegister) = "saveUserData($event)">
  </app-form-new-user>
</main>
