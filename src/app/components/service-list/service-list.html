<div class="service-list">
  <h2>Aconsegueix la millor qualitat</h2>

  <ul>
    @for (service of service(); track service.id) {
      
      <li>
<div class="container-checkbox">
      <input type="checkbox" 
      [checked]="service.selected" 
      (change)="onServiceChange(service)">
      <h5 class ="text-add-service">Afegir</h5>

</div>
      <h2>{{ service.name }}</h2>  
      <h3>${{ service.basePrice }}</h3>

<!-- solo aparece si el servicio es 'web' y está seleccionado -->
      @if (service.id === 'web' && service.selected) {
      <section class="web-configurator">
      <label class="input-pages">
          
          Número de págines:
          <input type="number" 
          [value]="service.pages" 
          (input)="onPagesChange(service, $event)
          " min="1">

        </label>

        <label class="input-lenguages">

          Número de llenguatges:
          <input type="number"
          [value]="service.languages" 
          (input)="onLanguagesChange(service, $event)
          " min="1">

        </label>
    </section>

      }
    </li>

    }

  </ul>
  <h3>Preu pressuposat: ${{totalPrice()}} </h3>
</div>
